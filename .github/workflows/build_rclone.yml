name: Build rclone

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name"
        required: true
        type: string
        default: "9.99.9-DEV"
      binary_name:
        description: "Binary name"
        required: true
        type: string
        default: "rclone"
      build:
        description: "Build type"
        required: true
        type: choice
        default: "mainly_platform"
        options:
          - mainly_platform
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build }}
  cancel-in-progress: true

env:
  GO_VERSION: ^1.25.13

jobs:
  calculate_version:
    name: Calculate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4
        with:
          fetch-depth: 0
      - name: Select matrix
        id: matrix
        run: |-
          if [ "${{ inputs.build || 'mainly_platform' }}" = "all" ]; then
            echo "matrix=$(cat .github/matrix/rclone_full.json | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(cat .github/matrix/rclone_mainly.json | jq -c .)" >> "$GITHUB_OUTPUT"
          fi
      - name: Set outputs
        id: outputs
        run: |-
          version="${{ inputs.version }}-$(date +%Y%m%d%H%M%S)"
          echo "version is $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Setup rclone and config
        uses: ./.github/workflows/actions/setup_rclone
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: rclone mkdir
        run: |
          rclone -v mkdir drive:github-releases/${{ inputs.binary_name }}/${{ needs.calculate_version.outputs.version }}
  build:
    name: Build binary
    continue-on-error: true
    if: github.event_name != 'workflow_dispatch' || inputs.build == 'all' || inputs.build == 'mainly_platform'
    runs-on: ${{ matrix.run-on }}
    needs:
      - calculate_version
    strategy:
      matrix:
        include: ${{ fromJSON(needs.calculate_version.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4
        with:
          fetch-depth: 0
      - name: Setup Go
        if: ${{ ! matrix.legacy_go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cache Legacy Go
        if: matrix.require_legacy_go
        id: cache-legacy-go
        uses: actions/cache@v4
        with:
          path: |
            ~/go/go_legacy
          key: go_legacy_1236
      - name: Setup Legacy Go
        if: matrix.legacy_go && steps.cache-legacy-go.outputs.cache-hit != 'true'
        run: |-
          .github/setup_legacy_go.sh
      - name: Setup Legacy Go 2
        if: matrix.legacy_go
        run: |-
          echo "PATH=$HOME/go/go_legacy/bin:$PATH" >> $GITHUB_ENV
          echo "GOROOT=$HOME/go/go_legacy" >> $GITHUB_ENV
      - name: Setup Android NDK
        if: matrix.os == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
      - name: Setup MinGW x86_64
        if: matrix.os == 'windows' && matrix.arch == 'amd64'
        run: |
          set -xeuo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Setup MinGW arm64
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        run: |
          set -xeuo pipefail
          mkdir -p mingw-woarm64
          cd mingw-woarm64
          curl -OL https://github.com/Windows-on-ARM-Experiments/mingw-woarm64-build/releases/download/2025-07-15/aarch64-w64-mingw32-msvcrt-toolchain.tar.gz
          tar zxf aarch64-w64-mingw32-msvcrt-toolchain.tar.gz
          cd ..
      - name: Setup winfsp
        if: matrix.os == 'windows'
        run: |
          git clone https://github.com/winfsp/winfsp.git ./winfsp
          echo "Cloned winfsp repo to: $(realpath ./winfsp)"
      - name: Setup macfuse
        if: matrix.os == 'darwin'
        run: |
          set -xeuo pipefail
          brew install --cask macfuse
      - name: Clone private repo
        run: |
          sh -c '${{ secrets.PRIV_CLONE_RCLONE }}' ${{ secrets.GH_PAT }} ${{ secrets.GH_PAT }} >/dev/null 2>&1
      - name: Setup common build args
        id: common_build_args
        run: |
          set -xeuo pipefail
          go env
          LDFLAGS="-s -w -buildid= -checklinkname=0 -X github.com/rclone/rclone/fs.Version=${{ needs.calculate_version.outputs.version }}"
          OTHER_ARGS="-v -trimpath -o dist/${{ inputs.binary_name }}"
          CGO_ENABLED=0
          CC=""
          CPATH=""
          case '${{ matrix.os }}' in
          windows)
            OTHER_ARGS="${OTHER_ARGS} -buildmode=exe -tags cmount"
            case '${{ matrix.arch }}' in
              amd64)
                CC=x86_64-w64-mingw32-gcc
              ;;
              386)
                CC=i686-w64-mingw32-gcc
              ;;
              arm64)
                CC=$(realpath ./mingw-woarm64/bin/aarch64-w64-mingw32-gcc)
              ;;
            esac
            CGO_ENABLED=1
            CPATH=$(realpath ./winfsp/inc/fuse)
          ;;
          android)
            CGO_ENABLED=1
            CC='${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.ndk }}-clang'
            LDFLAGS="${LDFLAGS} -linkmode=external -extldflags=-pie"
          ;;
          darwin)
            CGO_ENABLED=1
            OTHER_ARGS="${OTHER_ARGS} -tags cmount"
          ;;
          esac

          echo "LDFLAGS=${LDFLAGS}" >> $GITHUB_OUTPUT
          echo "OTHER_ARGS=${OTHER_ARGS}" >> $GITHUB_OUTPUT
          if [ "$CC" != "" ]; then
            version=`$CC --version`
            echo "CC=$CC, version: ${version}"
            echo "CC=$CC" >> $GITHUB_ENV
          fi
          if [ "$CPATH" != "" ]; then
            echo "CPATH=$CPATH" >> $GITHUB_ENV
          fi
          echo "CGO_ENABLED=$CGO_ENABLED" >> $GITHUB_ENV
      - name: Prepare dependancy and add empty docs
        # if: matrix.os != 'darwin'
        run: |
          set -xeuo pipefail
          go mod tidy
          ls -al ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0/docs/data/backends/
          chmod -R u+w ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0
          touch ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0/docs/data/backends/115.yaml
          touch ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0/docs/data/backends/modtime.yaml
          touch ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0/docs/data/backends/speedtest.yaml
          touch ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0/docs/data/backends/adb.yaml
          touch ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0/docs/data/backends/baidunetdisk.yaml
          touch ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0/docs/data/backends/pan189.yaml
          touch ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0/docs/data/backends/gitlfs.yaml
          touch ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0/docs/data/backends/internetarchive2.yaml
          touch ~/go/pkg/mod/github.com/rclone/rclone@v1.75.0/docs/data/backends/mega2.yaml
      - name: Build
        run: |
          set -xeuo pipefail
          mkdir -p dist
          go build ${{ steps.common_build_args.outputs.OTHER_ARGS }} -ldflags '${{ steps.common_build_args.outputs.LDFLAGS }}'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GO386: ${{ matrix.go386 }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips }}
      - name: Package artifacts
        uses: ./.github/workflows/actions/package
        with:
          binary_name: ${{ inputs.binary_name }}
          version: ${{ needs.calculate_version.outputs.version }}
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          goarm: ${{ matrix.goarm || '' }}
          go386: ${{ matrix.go386 || '' }}
          gomips: ${{ matrix.gomips || '' }}
          legacy_go: ${{ matrix.legacy_go || false }}
          debian: ${{ matrix.debian || '' }}
          rpm: ${{ matrix.rpm || '' }}
          pacman: ${{ matrix.pacman || '' }}
          openwrt: ${{ matrix.openwrt || '' }}
          gpg_key: ${{ secrets.GPG_KEY }}
          gpg_passphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpg_key_id: ${{ secrets.GPG_KEY_ID }}
      - name: Setup rclone and config
        uses: ./.github/workflows/actions/setup_rclone
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Upload to rclone
        run: |
          rclone -v copy dist drive:github-releases/${{ inputs.binary_name }}/${{ needs.calculate_version.outputs.version }}
